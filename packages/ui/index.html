<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Flowise - Build AI Agents, Visually</title>
        <link rel="icon" href="favicon.ico" />
        <!-- Meta Tags-->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#1a1a1a" />
        <style data-projecto-dark-first-paint>
            html,body,#root,#portal{background:#1a1a1a!important;color-scheme:dark}
        </style>
        <script data-projecto-missing-flow-guard>
            (function () {
                try {
                    localStorage.setItem('isDarkMode', 'true')
                    localStorage.setItem('isAuthenticated', 'true')
                    var user = localStorage.getItem('user')
                    if (!user || user === 'null' || user === 'undefined') {
                        localStorage.setItem(
                            'user',
                            JSON.stringify({
                                id: 'openideas',
                                name: 'OpenIdeas',
                                email: '',
                                isSSO: false,
                                assignedWorkspaces: [],
                                activeWorkspaceId: 'General'
                            })
                        )
                    }
                } catch (e) {}
                var re = /(?:^|\/)(undefined|null)\/?$/
                if (re.test(location.pathname)) history.replaceState(null, '', '/')
            })()
        </script>
        <meta name="title" content="Flowise - Build AI Agents, Visually" />
        <meta
            name="description"
            content="Open source generative AI development platform for building AI agents, LLM orchestration, and more"
        />
        <link rel="manifest" href="manifest.json" />
        <link rel="apple-touch-icon" href="logo192.png" />
        <meta name="keywords" content="react, material-ui, workflow automation, llm, artificial-intelligence" />
        <meta name="author" content="FlowiseAI" />
        <!-- Open Graph / Facebook -->
        <meta property="og:locale" content="en_US" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://flowiseai.com/" />
        <meta property="og:site_name" content="flowiseai.com" />
        <meta property="og:title" content="Flowise - Build AI Agents, Visually" />
        <meta
            property="og:description"
            content="Open source generative AI development platform for building AI agents, LLM orchestration, and more"
        />
        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://twitter.com/FlowiseAI" />
        <meta property="twitter:title" content="Flowise - Build AI Agents, Visually" />
        <meta
            property="twitter:description"
            content="Open source generative AI development platform for building AI agents, LLM orchestration, and more"
        />
        <meta name="twitter:creator" content="@FlowiseAI" />

        <link rel="preconnect" href="https://fonts.gstatic.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <!-- Rewardful (r.wdfl.co) removed: affiliate tracker rewrote SPA routes to /undefined -->
        <script>
            // Prefer an explicit host inject. Fall back to <base href> that
            // reverse-proxies (Projecto agent-workspace, Ideas canvas-island) add.
            window.__FLOWISE_BASENAME__ =
                window.__FLOWISE_BASENAME__ ||
                (function () {
                    var el = document.querySelector('base')
                    var href = el && el.getAttribute('href')
                    if (!href || href === '/') return ''
                    return href.replace(/\/$/, '')
                })()
        </script>
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"><div data-projecto-root-boot style="min-height:100vh;background:#1a1a1a"></div></div>
        <div id="portal"></div>
        <script type="module" src="src/index.jsx"></script>
        <script>
            if (global === undefined) {
                var global = window
            }
        </script>
    </body>
</html>
